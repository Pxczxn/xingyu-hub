name: CI Server

on:
  push:
    branches: [pxczxn, web-v2]
    paths:
      - "xingyu-server/**"
      - "sql/**"
      - "scripts/**"
      - ".gitattributes"
      - ".github/workflows/ci-server.yml"
  pull_request:
    paths:
      - "xingyu-server/**"
      - "sql/**"
      - "scripts/**"
      - ".gitattributes"
      - ".github/workflows/ci-server.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: xingyu-server · backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: xingyu_hub_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      TZ: Asia/Shanghai
      TEST_DB_ADMIN_USER: root
      TEST_DB_ADMIN_PASSWORD: root
      TEST_DB_USERNAME: root
      TEST_DB_PASSWORD: root
      TEST_DB_URL: "jdbc:mysql://127.0.0.1:3306/xingyu_hub_test?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install MySQL 8 and Redis clients
        run: sudo apt-get update && sudo apt-get install -y mysql-client-8.0 redis-tools

      - name: Align MySQL timezone with the application
        run: mysql -h127.0.0.1 -uroot -proot -e "SET GLOBAL time_zone = '+08:00';"

      - name: Rebuild test database
        run: bash sql/rebuild-test-db.sh

      - name: Run backend tests
        working-directory: xingyu-server
        run: mvn -B test -Dstyle.color=never
