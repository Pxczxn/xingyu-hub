name: CI Web

on:
  push:
    branches: [pxczxn, web-v2]
    paths:
      - "xingyu-web/**"
      - ".github/workflows/ci-web.yml"
  pull_request:
    paths:
      - "xingyu-web/**"
      - ".github/workflows/ci-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: xingyu-web · typecheck / lint / format / test / build / bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: xingyu-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: xingyu-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: npm run check:bundle
