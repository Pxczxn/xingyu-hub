# 浏览器测试进程专用 profile。只在显式激活 browser-test 时加载。
#
# 启动（不要同时带 dev / prod / test）：
#   先把 scripts/local-test-db.env 载入当前进程，再执行
#   mvn -f xingyu-server/xingyu-starter/pom.xml spring-boot:run "-Dspring-boot.run.profiles=browser-test"
#
# spring-boot.run.profiles 会以命令行覆盖基础配置里的默认 profile。
# 本文件不导入开发库凭据，也不读取开发库账号口令。
# 数据库口令只接受 TEST_DB_PASSWORD，没有默认值。

server:
  port: 7789

spring:
  application:
    name: xingyu-hub
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/xingyu_hub_test?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: ${TEST_DB_USERNAME:xingyu_test}
    password: ${TEST_DB_PASSWORD}
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 8
      max-wait: 60000
      test-while-idle: true
      validation-query: SELECT 1
      stat-view-servlet:
        enabled: false
      web-stat-filter:
        enabled: false
      filter:
        stat:
          enabled: false
        wall:
          enabled: false
  data:
    redis:
      host: localhost
      port: 6379
      database: 9
      lettuce:
        pool:
          max-active: 8
          max-wait: -1
          max-idle: 8
          min-idle: 0

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: top.pxczxn.xingyu.common.entity,top.pxczxn.xingyu.system.entity,top.pxczxn.xingyu.file.entity,top.pxczxn.xingyu.gen.entity,top.pxczxn.xingyu.job.entity,top.pxczxn.xingyu.community.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

xingyu:
  demo-mode: false
  # 这个 profile 和 Maven 集成测试共用 xingyu_hub_test。
  # 默认 5 秒轮询会把测试刚提交的 MomentChanged 拿走，并用进程启动时加载的旧代码回写索引。
  event:
    consumer:
      delay-ms: 3600000
  schema:
    migration:
      enabled: false
      dir: ../sql
  sql-monitor:
    enabled: false
