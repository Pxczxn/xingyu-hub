server:
  port: 7779

spring:
  application:
    name: xingyu-hub
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/xingyu_hub?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: ${DB_USERNAME:pxczxn}
    # 仓库不提交任何可用密码：默认值是明确无效的占位符，必须通过环境变量 DB_PASSWORD 提供，
    # 否则连接必然认证失败（fail-fast，不会静默连上）。本地凭据放 gitignore 的 scripts/local-db.env。
    password: ${DB_PASSWORD:__SET_DB_PASSWORD__}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      test-while-idle: true
      validation-query: SELECT 1
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        # 仓库不提交任何可用口令：默认值是明确无效的占位符，必须由环境变量 DRUID_USERNAME /
        # DRUID_PASSWORD 提供，否则监控页无法登录（fail-fast，不会静默沿用弱口令）。
        # 本地可用值放在 gitignore 的 scripts/local-db.env。生产 profile 已关闭该页面。
        login-username: ${DRUID_USERNAME:__SET_DRUID_USERNAME__}
        login-password: ${DRUID_PASSWORD:__SET_DRUID_PASSWORD__}
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      filter:
        stat:
          enabled: true
        wall:
          enabled: true
          config:
            # 允许 SQL 中的 -- 注释与多语句：SchemaMigrator 受控执行的迁移文件
            # （sql/V*.sql）携带中文注释头，且幂等迁移（V041/V051 先例）依赖
            # SET @var + PREPARE/EXECUTE 的多语句形态。wall 默认两者都拦，
            # 导致 V050（注释）/V051（多语句）登记 FAILED（2026-10-11）。
            # 安全影响可控：应用流量全部 PreparedStatement 参数化，注释/堆叠
            # 注入无落点；迁移文件是仓库内受控内容，非外部输入。
            # 生产启用迁移前需单独评估。
            # 注意：两属性必须挂在 wall.config 下（WallConfig 属性），直接挂在
            # wall 层不生效（首次执行已踩坑）。
            comment-allow: true
            multi-statement-allow: true
            # V041/V051 的幂等守卫形态依赖 PREPARE/EXECUTE，wall 默认禁
            # MySqlPrepareStatement 语句类型（第三次执行踩坑）。
            prepare-statement-allow: true
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 6
      lettuce:
        pool:
          max-active: 8
          max-wait: -1
          max-idle: 8
          min-idle: 0

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: top.pxczxn.xingyu.common.entity,top.pxczxn.xingyu.system.entity,top.pxczxn.xingyu.file.entity,top.pxczxn.xingyu.gen.entity,top.pxczxn.xingyu.job.entity,top.pxczxn.xingyu.community.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0


# ======================== 应用配置 ========================
xingyu:
  # 演示模式配置（此处为开发环境默认值，生产环境请在 application-prod.yml 中配置）
  # true: 开启演示模式，禁止新增、编辑、删除操作
  # false: 关闭演示模式，允许所有操作
  demo-mode: false
  schema:
    migration:
      enabled: false
      dir: ../sql
  sql-monitor:
    enabled: true
    max-records: 100
    warn-threshold-ms: 500
    slow-threshold-ms: 1000
  community:
    public-base-url: http://localhost:3000

# 日志配置
logging:
  level:
    top.pxczxn.xingyu: debug
