server:
  port: 7779
  # 默认只绑回环。环境变量 SERVER_ADDRESS 可覆盖（例如经本机 Nginx 反代时保持 127.0.0.1）。
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: xingyu-hub
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 无默认库名。缺 DB_URL / DB_USERNAME / DB_PASSWORD 时占位符无法解析，进程拒绝启动，
    # 不会回落到 xingyu_hub / xingyu_hub_test。环境变量覆盖 YAML（Spring 标准优先级）。
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      test-while-idle: true
      validation-query: SELECT 1
      stat-view-servlet:
        enabled: false
      web-stat-filter:
        enabled: false
      filter:
        stat:
          enabled: true
        wall:
          enabled: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # 无默认 DB 下标，避免继承开发环境 DB6。缺 REDIS_DATABASE 时启动失败。
      database: ${REDIS_DATABASE}
      timeout: 2000ms
      connect-timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: 2000ms
          max-idle: 8
          min-idle: 0

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: top.pxczxn.xingyu.common.entity,top.pxczxn.xingyu.system.entity,top.pxczxn.xingyu.file.entity,top.pxczxn.xingyu.gen.entity,top.pxczxn.xingyu.job.entity,top.pxczxn.xingyu.community.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

xingyu:
  demo-mode: false
  schema:
    migration:
      enabled: false
      dir: ../sql
  security:
    # 逗号分隔的精确来源。留空或写成 * 时生产环境不返回跨域允许头。
    cors:
      allowed-origins: ${XINGYU_CORS_ALLOWED_ORIGINS:}
    # 迁移基线为保留可复现的迁移链，种子数据里保留了 admin 的已知默认口令。
    # 对外 Web 启动时 DefaultAdminPasswordGuard 会扫描 sys_user，命中即终止启动。
    # grant-admin（非 Web）会把匹配的档案哈希封存为不可登录值，然后才能启动 Web。
    default-admin-passwords: admin123,123456,admin
    # 仅在确认风险后临时置 true 才能放行，默认必须为 false。
    allow-default-admin-password: false
  sql-monitor:
    enabled: false
    max-records: 100
    warn-threshold-ms: 500
    slow-threshold-ms: 1000

logging:
  level:
    top.pxczxn.xingyu: info
    root: warn
